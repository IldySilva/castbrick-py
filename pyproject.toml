[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "castbrick"
version = "0.1.2"
description = "Official Python SDK for the CastBrick API — SMS, Contacts and Broadcasts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "CastBrick", email = "support@castbrick.com" }]
keywords = ["castbrick", "sms", "sdk", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Repository = "https://github.com/IldySilva/castbrick-pypi"

[tool.setuptools.packages.find]
where = ["."]
include = ["castbrick*"]
